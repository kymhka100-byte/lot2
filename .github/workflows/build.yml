name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake gettext lld
        pip install --upgrade pip
        pip install --upgrade buildozer cython kivy

    - name: Pre-accept Android SDK Licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n2477218778daf9088f9a34d8820c74902146e2a0" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo -e "\nd9826f5c792e78475e734857097002b422d47751" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
        echo -e "\n60100719fe771612639b22a7d30142f7aea32c29" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license

    - name: Build with Buildozer
      run: |
        APP_ANDROID_ACCEPT_SDK_LICENSES=1 buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lotto-App-APK
        path: bin/*.apk
