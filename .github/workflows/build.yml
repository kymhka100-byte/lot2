e: Build Andr
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake gettext lld
        pip install --upgrade pip
        pip install --upgrade buildozer cython kivy

    - name: Build with Buildozer
      run: |
        # Buildozer가 라이선스를 대화형 묻지 않고 자동 승인하도록 환경변수 설정 후 실행
        ACCEPT_SDK_LICENSE=1 APP_ANDROID_ACCEPT_SDK_LICENSES=1 buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lotto-App-APK
        path: bin/*.apk
